name: Analytics integration

on:
  pull_request:
    paths:
      - "src/storage/**"
      - "src/reporters/analytics-reporter.ts"
      - "src/cli/report.ts"
      - "src/exporters/powerbi-exporter.ts"
      - "tests/**/*analytics*"
      - "scripts/verify-postgres-analytics.js"
      - "scripts/verify-analytics-dashboard.js"
      - ".github/workflows/analytics-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dashboard:
    name: Analytics dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand --testPathPatterns=analytics
      - name: Verify built dashboard workflow
        run: node scripts/verify-analytics-dashboard.js artifacts/analytics-dashboard
      - name: Upload dashboard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-dashboard-${{ github.run_id }}
          path: |
            artifacts/analytics-dashboard/analytics.json
            artifacts/analytics-dashboard/analytics.html
          if-no-files-found: error
          retention-days: 14

  postgres:
    name: PostgreSQL analytics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prova
          POSTGRES_PASSWORD: prova-ci
          POSTGRES_DB: prova_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prova -d prova_analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://prova:prova-ci@127.0.0.1:5432/prova_analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/verify-postgres-analytics.js
