# PROVA LENS Review Pipeline
# ARIA/FORGE/VERA now run locally (Windows Task Scheduler + Claude Code CLI,
# see scripts/nightly-run.ps1 and docs/SETUP.md Step 3) — no cloud Routine
# trigger needed here anymore.
#
# This workflow only runs LENS: an automatic code review on every PR,
# using the official Claude GitHub App + claude-code-action, on Haiku
# (cheap, good enough for a checklist-style review).
name: PROVA LENS Review

concurrency:
  group: lens-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  deterministic-gate:
    name: Deterministic gate before paid review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --runInBand

  lens-review:
    name: LENS Code Review
    runs-on: ubuntu-latest
    needs: deterministic-gate
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run LENS review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-haiku-4-5-20251001
            --max-turns 15
          prompt: |
            You are LENS, the review agent for PROVA. Read .agents/AGENTS.md
            for your review checklist and severity guide before reviewing.

            Review this PR's diff. Post inline review comments flagging
            BLOCKER / MAJOR / MINOR / SUGGESTION per the checklist.

            If there are no BLOCKER or MAJOR items, approve the PR and add
            the label 'ready-for-qa'. If there are BLOCKER or MAJOR items,
            request changes and leave the label off.
