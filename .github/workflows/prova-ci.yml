# PROVA CI/CD Pipeline
# Runs on every PR and push to develop/main
name: PROVA Quality Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── TypeScript + Lint check ─────────────────────────────────────
  typecheck:
    name: TypeScript + Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  # ── Parallel test matrix ────────────────────────────────────────
  test-matrix:
    name: Tests (${{ matrix.scope }})
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      matrix:
        scope: [browser, api, mobile]
      max-parallel: 3   # all 3 run simultaneously
      fail-fast: false  # don't cancel other scopes if one fails
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run ${{ matrix.scope }} tests
        run: npm test -- --testPathPattern=${{ matrix.scope }} --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.scope }}
          path: coverage/

  # ── SHIP: publish on merge to main ─────────────────────────────
  ship:
    name: SHIP — Publish to npm
    runs-on: ubuntu-latest
    needs: [typecheck, test-matrix]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci

      - name: Check for release approval
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ ! -f "releases/v${VERSION}-approval.md" ]; then
            echo "No approval doc found for v${VERSION}. Skipping publish."
            exit 0
          fi
          echo "Approval found. Publishing v${VERSION}..."

      - name: Bump version and publish
        run: |
          git config user.email "prova-ship@provae2e.com"
          git config user.name "PROVA SHIP Agent"
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          git add package.json
          git commit -m "chore: release v${VERSION} [skip ci]"
          git tag "v${VERSION}"
          git push && git push --tags
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Post-deploy smoke suite ─────────────────────────────────────
  smoke:
    name: Post-deploy Smoke
    runs-on: ubuntu-latest
    needs: ship
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run smoke suite
        run: npm test -- --testPathPattern=smoke
