# PROVA CI/CD Pipeline
# Runs on every PR and push to develop/main
name: PROVA Quality Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ── TypeScript + Lint check ─────────────────────────────────────
  typecheck:
    name: TypeScript + Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: Install PROVA Studio dependencies
        run: npm ci --prefix studio
      - name: Validate PROVA Studio source
        run: npm run typecheck --prefix studio && npm run lint --prefix studio

  # ── Full test suite + coverage gate ─────────────────────────────
  # Runs every test file under tests/ (no --testPathPattern filter) so newly
  # added test directories are always included automatically, and enforces
  # the 80% coverage floor (package.json's jest.coverageThreshold) as a real
  # build-failing gate rather than just collecting coverage for display.
  test:
    name: Tests + coverage gate
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install PROVA Studio dependencies
        run: npm ci --prefix studio
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run full test suite with coverage gate
        run: npm run test:ci
      - name: Test and build PROVA Studio
        run: npm test --prefix studio && npm run build --prefix studio && npm run build-storybook --prefix studio
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  slice2-evidence:
    name: Slice 2 failure evidence + secret safety
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture and validate intentional-failure evidence
        run: npm run test:slice2
        env:
          SLICE2_SYNTHETIC_SECRET: ghp_CIOnlySyntheticCredential123456789
          SLICE2_SYNTHETIC_TOKEN: sk-CIOnlySyntheticToken123456789
      - name: Upload Slice 2 diagnostic evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slice2-failure-evidence
          path: artifacts/slice2/
          retention-days: 14

  slice3-analytics:
    name: Slice 3 analytics migration + BrowserStack status
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Validate analytics migration, retention, scale, and corruption handling
        run: npm run test:slice3
      - name: Upload Slice 3 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slice3-analytics-evidence
          path: artifacts/slice3/
          retention-days: 14

  # ── SHIP: publish only on explicit manual dispatch ─────────────
  ship:
    name: SHIP — Publish to npm
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci

      - name: Verify npm authentication
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is not configured. Add it in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check for release approval
        run: node scripts/check-release-approval.js

      - name: Install Playwright browsers for prepublish checks
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Publish approved package version
        run: |
          git config user.email "prova-ship@provae2e.com"
          git config user.name "PROVA SHIP Agent"
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${VERSION}" == *-* ]]; then
            NPM_TAG="${VERSION#*-}"
            NPM_TAG="${NPM_TAG%%.*}"
          else
            NPM_TAG="latest"
          fi
          if npm view "@provae2e/cli@${VERSION}" version >/dev/null 2>&1; then
            echo "@provae2e/cli@${VERSION} is already published; skipping npm publish."
          else
            npm publish --tag "${NPM_TAG}"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists; skipping tag creation."
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi
          RELEASE_FLAGS=()
          if [[ "${VERSION}" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          NOTES_FILE="releases/v${VERSION}.md"
          if [[ ! -f "${NOTES_FILE}" && -f "releases/v${VERSION}-foundation-evidence.md" ]]; then
            NOTES_FILE="releases/v${VERSION}-foundation-evidence.md"
          fi
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "GitHub release v${VERSION} already exists; skipping release creation."
          elif [[ -f "${NOTES_FILE}" ]]; then
            gh release create "v${VERSION}" --title "PROVA v${VERSION}" --notes-file "${NOTES_FILE}" "${RELEASE_FLAGS[@]}"
          else
            gh release create "v${VERSION}" --title "PROVA v${VERSION}" --generate-notes "${RELEASE_FLAGS[@]}"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Post-deploy smoke suite ─────────────────────────────────────
  smoke:
    name: Post-deploy Smoke
    runs-on: ubuntu-latest
    needs: ship
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run smoke suite
        # test:smoke does NOT pass --passWithNoTests, unlike the plain `test`
        # script - so this fails the build if zero smoke tests actually run.
        run: npm run test:smoke
