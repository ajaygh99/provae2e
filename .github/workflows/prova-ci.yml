# PROVA CI/CD Pipeline
# Runs on every PR and push to develop/main
name: PROVA Quality Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ── TypeScript + Lint check ─────────────────────────────────────
  typecheck:
    name: TypeScript + Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  # ── Full test suite + coverage gate ─────────────────────────────
  # Runs every test file under tests/ (no --testPathPattern filter) so newly
  # added test directories are always included automatically, and enforces
  # the 80% coverage floor (package.json's jest.coverageThreshold) as a real
  # build-failing gate rather than just collecting coverage for display.
  test:
    name: Tests + coverage gate
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run full test suite with coverage gate
        run: npm run test:ci
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  # ── SHIP: publish only on explicit manual dispatch ─────────────
  ship:
    name: SHIP — Publish to npm
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci

      - name: Verify npm authentication
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is not configured. Add it in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check for release approval
        run: node scripts/check-release-approval.js

      - name: Install Playwright browser for prepublish checks
        run: npx playwright install --with-deps chromium

      - name: Bump version and publish
        run: |
          git config user.email "prova-ship@provae2e.com"
          git config user.name "PROVA SHIP Agent"
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          npm publish
          git add package.json
          git commit -m "chore: release v${VERSION} [skip ci]"
          git tag "v${VERSION}"
          git push && git push --tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Post-deploy smoke suite ─────────────────────────────────────
  smoke:
    name: Post-deploy Smoke
    runs-on: ubuntu-latest
    needs: ship
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run smoke suite
        # test:smoke does NOT pass --passWithNoTests, unlike the plain `test`
        # script - so this fails the build if zero smoke tests actually run.
        run: npm run test:smoke
